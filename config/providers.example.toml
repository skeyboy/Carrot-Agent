# Copy this file to the application config directory during Phase 2.
# Credentials are referenced by key and remain in the OS credential store.

[[providers]]
id = "openai"
label = "OpenAI"
kind = "openai_responses"
base_url = "https://api.openai.com/v1"
default_model = "gpt-5.6"
credential_ref = "openai-api-key"
store_responses = true

[[providers]]
id = "local-compatible"
label = "Local compatible endpoint"
kind = "openai_compatible"
base_url = "http://127.0.0.1:11434/v1"
default_model = "replace-with-model-id"
credential_ref = "local-compatible-api-key"
store_responses = true
